version: 2
updates:
  - package-ecosystem: npm
    directory: /
    security-updates: true
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: deps
      include: scope
    groups:
      development-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    security-updates: true
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: deps
      include: scope
