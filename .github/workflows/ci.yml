name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Structured data check
        run: npm run check:seo

      - name: Content check
        run: npm run check:content

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: npm audit (high+)
        run: npm run audit:deps
      - name: Verify CSP meta tag
        run: grep -q 'http-equiv="Content-Security-Policy"' index.html

  e2e:
    name: E2E smoke + axe a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      - name: axe accessibility
        run: npm run test:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual Regression
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Visual regression tests
        run: npm run test:visual
      - name: Upload visual diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Lighthouse CI
        run: npm run lhci

  deploy:
    name: Verify Pages deployment
    needs: [check, security, e2e, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      # Pages is configured to build from the main branch (build_type:
      # legacy), so the site publishes on push independent of CI. This job
      # verifies that the branch build for THIS commit went live. The old
      # upload-pages-artifact/deploy-pages pair raced GitHub's artifact
      # service: deploy-pages queried the artifact list ~300ms after upload,
      # before the artifact had registered, and failed with 'No artifacts
      # named "github-pages" were found' even though the upload succeeded.
      # Pages also sometimes skips a build entirely for pushes that touch no
      # published files (observed: snapshots-only commit got no build), so
      # after waiting we request a build ourselves as a fallback.
      - name: Wait for the Pages build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          latest() {
            gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
              --jq '.commit // "none"' 2>/dev/null || echo none
          }
          for i in $(seq 1 20); do
            COMMIT=$(latest)
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.status // "none"' 2>/dev/null || echo none)
            echo "attempt ${i}/20: pages build commit=${COMMIT:0:7} status=${STATUS}"
            if [ "$COMMIT" = "$EXPECTED_SHA" ] && [ "$STATUS" = "built" ]; then
              echo "Pages build for ${COMMIT:0:7} is live."
              exit 0
            fi
            sleep 15
          done
          echo "No Pages build for ${EXPECTED_SHA:0:7} after 5 minutes — requesting one."
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
          for i in $(seq 1 40); do
            COMMIT=$(latest)
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.status // "none"' 2>/dev/null || echo none)
            echo "post-request attempt ${i}/40: commit=${COMMIT:0:7} status=${STATUS}"
            if [ "$COMMIT" = "$EXPECTED_SHA" ] && [ "$STATUS" = "built" ]; then
              echo "Pages build for ${COMMIT:0:7} is live."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Pages did not build ${EXPECTED_SHA:0:7} (latest: ${COMMIT:0:7}, ${STATUS})."
          exit 1
      - name: Verify site health
        run: |
          URL="https://baruntayenjam.github.io/manipur-economy/"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 15 "$URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Deployment healthy (HTTP 200)"
              exit 0
            fi
            echo "Waiting for site... ($i/5, HTTP $CODE)"
            sleep 10
          done
          echo "::error::Deployment health check failed"
          exit 1

